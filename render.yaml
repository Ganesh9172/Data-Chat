services:
  - type: web
    name: firebird-data-chat
    env: python
    buildCommand: "npm --prefix frontend install && npm --prefix frontend run build && pip install -r backend/requirements.txt"
    startCommand: "python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: AI_MODEL
        value: openai/gpt-oss-120b
      - key: AI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: AI_API_KEY
        sync: false
